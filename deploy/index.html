<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cluster Trial Designer</title>

    <!-- Ajax-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script> 
    
    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script>
  // Log visitor
  fetch('https://ipapi.co/json/')
    .then(r => r.json())
    .then(data => {
      fetch('log-visit.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      }).catch(() => {});
    })
    .catch(() => {});
</script>

    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #loading-overlay.hidden { display: none; }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #error-display {
        display: none;
        max-width: 600px;
        padding: 24px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        margin-top: 24px;
      }
      #error-display.show { display: block; }
      #error-display pre {
        background: #1e293b;
        color: #f8fafc;
        padding: 16px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p id="loading-status" style="margin-top: 16px; color: #64748b;">Loading WASM module...</p>
      <div id="error-display">
        <h3 style="color: #dc2626; font-weight: 600; margin: 0;">Error Loading Application</h3>
        <p id="error-message" style="color: #7f1d1d; margin-top: 8px;"></p>
        <pre id="error-stack"></pre>
      </div>
    </div>
    
    <div id="root"></div>
    
    <!-- WASM Module -->
    <script src="glmm_wasm.js"></script>
    
    <!-- Shared utilities exposed to global scope -->
    <script src="wasmLoader.global.js"></script>
    <script src="reportGenerator.js"></script> 
    <!-- Main application (JSX transformed by Babel) -->
    <script type="text/babel" src="App.jsx" async></script>
    
    <script>
      // Error handling
      window.onerror = function(msg, url, line, col, error) {
        showError(msg, error?.stack);
        return false;
      };
      
      window.addEventListener('unhandledrejection', function(event) {
        showError(event.reason?.message || 'Promise rejected', event.reason?.stack);
      });
      
      function showError(message, stack) {
        document.getElementById('loading-status').textContent = 'Error occurred';
        document.getElementById('error-message').textContent = message;
        document.getElementById('error-stack').textContent = stack || '';
        document.getElementById('error-display').classList.add('show');
      }
      
      function updateLoadingStatus(status) {
        document.getElementById('loading-status').textContent = status;
      }
      
      function hideLoading() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }
      
      // Expose helpers to app
      window.AppHelpers = {
        updateLoadingStatus,
        hideLoading,
        showError
      };
    </script>
  </body>
</html>
